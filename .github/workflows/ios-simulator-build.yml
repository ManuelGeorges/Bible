name: Build iOS for Appetize.io

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Static Export
        run: npm run build:mobile

      - name: Capacitor Sync
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          # تحديث الإضافات والتزامن
          npx cap update ios
          npx cap sync ios

      - name: Build iOS App for Simulator
        run: |
          # تنظيف أي بناء سابق لضمان عدم وجود ملفات متضاربة
          xcodebuild clean -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator
          
          # البناء للمحاكي مع تجاهل تواقيع الأكواد (لأننا نبني للمحاكي فقط)
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -sdk iphonesimulator \
                     -destination 'generic/platform=iOS Simulator' \
                     -configuration Debug \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     OTHER_SWIFT_FLAGS="$(inherited) -DDEBUG"

      - name: Prepare for Appetize.io
        run: |
          mkdir -p build-output
          APP_PATH=$(find build/Build/Products -name "App.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: App.app not found!"
            exit 1
          fi
          cp -R "$APP_PATH" build-output/
          cd build-output
          zip -r ../ios-simulator-app.zip App.app

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ios-simulator-app.zip
          retention-days: 5
