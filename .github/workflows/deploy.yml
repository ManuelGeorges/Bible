name: Deploy Agios Bible
on:
  push:
    branches:
      - main  # أو اسم البرانش بتاعك

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22' # تم التحديث إلى 22 ليتوافق مع Capacitor 8
          cache: 'npm'

      - name: Install and Build
        run: |
          npm ci
          npm run build 

      - name: Zip build
        run: |
          cd out && zip -r ../dist.zip . && cd ..

      - name: Deploy to Capgo
        run: |
          npx @capgo/cli@latest bundle upload --channel production --path ./dist.zip --apikey ${{ secrets.CAPGO_TOKEN }} -v 1.0.2