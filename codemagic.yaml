workflows:
  ios-testflight:
    name: iOS TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: "Agios App Store Key"
    environment:
      groups:
        - ios-secrets
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.agios.bible"
        TEAM_ID: "XMBVV283C4"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web project
        script: |
          npm run build:mobile
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Increment Build Number
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 100))
      - name: Build and Sign IPA
        script: |
          keychain initialize
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/*
          
          # جلب أو إنشاء الشهادات والبروفايلات (الأوامر المحدثة)
          app-store-connect certificates create --type IOS_DISTRIBUTION --save
          app-store-connect profiles create --bundle-id "$BUNDLE_ID" --type IOS_APP_STORE --name "Agios Bible TestFlight" --save
          
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          
          # استخراج UUID البروفايل الجديد
          PROV_PROFILE=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -n 1)
          if [ -z "$PROV_PROFILE" ]; then
            echo "خطأ: فشل جلب البروفايل. تأكد من تحديث الـ Key ID الجديد في Codemagic."
            exit 1
          fi
          PROV_UUID=$(security cms -D -i "$PROV_PROFILE" | /usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin)
          
          # إجبار Xcode على التوقيع اليدوي وحقن الـ Team ID
          sed -i '' "s/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g" "$XCODE_PROJECT/project.pbxproj"
          sed -i '' "s/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = $TEAM_ID;/g" "$XCODE_PROJECT/project.pbxproj"
          
          xcode-project use-profiles --project "$XCODE_PROJECT"
          
          # بناء الـ IPA
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags "DEVELOPMENT_TEAM=$TEAM_ID PROVISIONING_PROFILE_SPECIFIER=$PROV_UUID CODE_SIGN_STYLE=Manual CODE_SIGN_ENTITLEMENTS=App/App.entitlements"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true