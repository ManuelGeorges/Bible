workflows:
  ios-release:
    name: Build iOS Release (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 22
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.agios.bible"
        # App Store Connect API Keys
        APP_STORE_CONNECT_ISSUER_ID: "f458a0dc-007e-4a1b-88d9-40b42981095d"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "MN275R95N4"
        APP_STORE_CONNECT_PRIVATE_KEY: |
          -----BEGIN PRIVATE KEY-----
          MIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQgllhAeHQA43x283qD
          UeXfVU1QhYvURPTUcazt8b2KLrqgCgYIKoZIzj0DAQehRANCAAQV9v/nzcRClJZL
          UfRyMcdolKCFB5i5/BkJ98E9zAL+fh5UokGF6OXzD/J2Vi/e06JAqPA/LsnZUCzr
          q/a+XVjD
          -----END PRIVATE KEY-----
    cache:
      cache_paths:
        - node_modules
        - ~/.npm

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'

    scripts:
      - name: Install Dependencies
        script: | 
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build Next.js Static Export
        script: npm run build:mobile

      - name: Capacitor Sync
        script: |
          npx cap sync ios

      - name: Patch iOS Project for CI
        script: |
          # 1. Force iOS 15.0 Deployment Target
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj
          if [ -f "ios/App/CapApp-SPM/Package.swift" ]; then
            sed -i '' 's/.iOS(.v[0-9]*)/.iOS(.v15)/g' ios/App/CapApp-SPM/Package.swift
          fi
          
          # 2. Force Manual Signing Style
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/App/App.xcodeproj/project.pbxproj
          
          # 3. Robust Capability Injection using Python
          python3 -c "
          import re
          path = 'ios/App/App.xcodeproj/project.pbxproj'
          with open(path, 'r') as f: content = f.read()
          
          # Find the target ID for 'App'
          target_match = re.search(r'([A-F0-9]{24}) /\* App \*/ = \{', content)
          if target_match:
              tid = target_match.group(1)
              caps = 'SystemCapabilities = { com.apple.Push = { enabled = 1; }; com.apple.AppleSignIn = { enabled = 1; }; };'
              if 'SystemCapabilities' not in content:
                  # Inject into TargetAttributes section
                  pattern = rf'({tid}\s*=\s*\{{[^}}]*?ProvisioningStyle = Manual;)'
                  content = re.sub(pattern, rf'\1 {caps}', content, flags=re.DOTALL)
          
          # Force Entitlements and remove any auto-generated team IDs that might conflict
          content = re.sub(r'CODE_SIGN_ENTITLEMENTS = [^;]*;', 'CODE_SIGN_ENTITLEMENTS = App/App.entitlements;', content)
          
          with open(path, 'w') as f: f.write(content)
          "
          
          # 4. Fix Entitlements for Production
          if [ -f "ios/App/App/App.entitlements" ]; then
            sed -i '' 's/development/production/g' ios/App/App/App.entitlements
          fi

      - name: Set up Keychain
        script: keychain initialize

      - name: Fetch Profiles and Code Sign
        script: |
          # Fetch profiles automatically using API keys
          xcode-project use-profiles

      - name: Build IPA for TestFlight
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
