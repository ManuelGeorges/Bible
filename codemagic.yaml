workflows:
  ios-testflight:
    name: iOS TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: "Agios App Store Key"
    environment:
      groups:
        - ios-secrets
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.agios.bible"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web project
        script: |
          npm run build:mobile
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Increment Build Number
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 100))
      - name: Codemagic Code Signing
        script: |
          keychain initialize
          # 1. مسح أي بروفايلات قديمة مخزنة في السيرفر
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/*
          
          # 2. إنشاء وجلب بروفايل جديد (بما أننا حذفنا القديم يدوياً من موقع أبل، سيقوم بإنشاء واحد نظيف يدعم Push و Sign In)
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          
          keychain add-certificates
          
          # 3. إجبار المشروع على استخدام التوقيع اليدوي والبروفايلات الجديدة
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build IPA
        script: |
          # بناء الـ IPA مع التأكيد على أن التوقيع يدوي ليتوافق مع البروفايل المجلوب
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags "CODE_SIGN_STYLE=Manual"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
