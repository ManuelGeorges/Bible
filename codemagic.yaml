workflows:
  ios-testflight:
    name: iOS TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: "Agios App Store Key"
    environment:
      groups:
        - ios-secrets
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.agios.bible"
        TEAM_ID: "XMBVV283C4"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web project
        script: |
          npm run build:mobile
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Increment Build Number
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 100))
      - name: Build and Sign IPA
        script: |
          # 1. تهيئة الـ Keychain وتنظيف السيرفر
          keychain initialize
          find ~/Library -name "*.mobileprovision" -delete
          
          # 2. جلب التوقيع المحدث من أبل (سيقوم بإنشاء الشهادة والبروفايل تلقائياً)
          # حذفنا الباسوورد هنا لتجنب خطأ unrecognized arguments
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          
          # 3. استخراج الـ UUID بعد فك التشفير (للتأكد فقط)
          PROV_PROFILE=$(find ~/Library -name "*.mobileprovision" | head -n 1)
          security cms -D -i "$PROV_PROFILE" > /tmp/profile.plist
          PROV_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist)
          echo "تم تجهيز البروفايل: $PROV_UUID"
          
          # 4. تطهير ملف المشروع برمجياً (تغيير كل المسميات القديمة لـ Apple Distribution)
          # هذه الخطوة ستحل مشكلة تعارض الهويات (iPhone vs Apple)
          sed -i '' "s/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g" "$XCODE_PROJECT/project.pbxproj"
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g" "$XCODE_PROJECT/project.pbxproj"
          sed -i '' "s/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = $TEAM_ID;/g" "$XCODE_PROJECT/project.pbxproj"
          sed -i '' "s/iPhone Distribution/Apple Distribution/g" "$XCODE_PROJECT/project.pbxproj"
          sed -i '' "s/iPhone Developer/Apple Distribution/g" "$XCODE_PROJECT/project.pbxproj"
          
          # 5. ربط البروفايلات بالمشروع بشكل آلي
          xcode-project use-profiles --project "$XCODE_PROJECT"
          
          # 6. بناء الـ IPA النهائي
          # سنترك الأداة تستخدم الإعدادات التي حقناها في المشروع لضمان عدم وجود أعلام متعارضة في السجل
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
