workflows:
  ios-testflight:
    name: iOS TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: "Agios App Store Key"
    environment:
      groups:
        - ios-secrets
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.agios.bible"
        TEAM_ID: "XMBVV283C4"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web project
        script: |
          npm run build:mobile
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Inject iOS Widgets (Automated Xcode Script)
        script: |
          cd ios
          gem install xcodeproj
          ruby add_widgets.rb
      - name: Increment Build Number
        script: |
          cd ios/App
          agvtool new-marketing-version 2.1.2
          agvtool new-version -all $(date +%s)
      - name: Build and Sign IPA
        script: |
          # 1. تهيئة الـ Keychain وتنظيف السيرفر
          keychain initialize
          find ~/Library -name "*.mobileprovision" -delete
          
          # 2. جلب التوقيع المحدث للتطبيق وللويدجت
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "com.agios.bible.AgiosWidgets" --type IOS_APP_STORE --create
          keychain add-certificates
          
          # 3. تعديل ملف المشروع برمجياً لتفعيل الصلاحيات (Sign In with Apple) وربط الـ Entitlements
          sed -i '' "s/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g" "$XCODE_PROJECT/project.pbxproj"
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g" "$XCODE_PROJECT/project.pbxproj"
          
          # إضافة مرجع ملف الـ Entitlements في إعدادات البناء (مهم جداً)
          sed -i '' "/CODE_SIGN_IDENTITY = \"iPhone Distribution\"/a\\
          CODE_SIGN_ENTITLEMENTS = App/App.entitlements;" "$XCODE_PROJECT/project.pbxproj"
          
          # 4. تطهير ملف المشروع برمجياً وضبط الـ Team ID
          sed -i '' "s/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = $TEAM_ID;/g" "$XCODE_PROJECT/project.pbxproj"
          sed -i '' "s/iPhone Distribution/Apple Distribution/g" "$XCODE_PROJECT/project.pbxproj"
          
          # 5. ربط البروفايلات بالمشروع
          xcode-project use-profiles --project "$XCODE_PROJECT"
          
          # 6. بناء الـ IPA النهائي
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
