workflows:
  ios-testflight:
    name: iOS TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: "Agios App Store Key"
    environment:
      groups:
        - ios-secrets
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.agios.bible"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web project
        script: |
          npm run build:mobile
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Increment Build Number
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 100))
      - name: Build and Sign IPA
        script: |
          # 1. تهيئة الـ Keychain وتنظيف البروفايلات القديمة
          keychain initialize
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/*
          
          # 2. إنشاء الشهادة والبروفايل (بما أنك حذفتهم، سيتم إنشاؤهم الآن بدعم Push و Sign In)
          app-store-connect create-certificate --type IOS_DISTRIBUTION --save
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          
          # 3. استخراج المعرفات UUID و Team ID محلياً لاستخدامها فوراً
          PROV_PROFILE=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -n 1)
          if [ -z "$PROV_PROFILE" ]; then
            echo "خطأ: لم يتم العثور على بروفايل التوقيع!"
            exit 1
          fi
          
          PROV_UUID=$(security cms -D -i "$PROV_PROFILE" | /usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin)
          TEAM_ID=$(security cms -D -i "$PROV_PROFILE" | /usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /dev/stdin)
          
          echo "تم العثور على Team ID: $TEAM_ID"
          echo "تم العثور على Profile UUID: $PROV_UUID"
          
          # 4. تحديث إعدادات المشروع برمجياً للتوقيع اليدوي
          sed -i '' "s/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g" "$XCODE_PROJECT/project.pbxproj"
          xcode-project use-profiles --project "$XCODE_PROJECT"
          
          # 5. بناء الـ IPA مع تمرير كل المعرفات المطلوبة لـ Xcode
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags "DEVELOPMENT_TEAM=$TEAM_ID PROVISIONING_PROFILE_SPECIFIER=$PROV_UUID CODE_SIGN_STYLE=Manual CODE_SIGN_ENTITLEMENTS=App/App.entitlements"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
