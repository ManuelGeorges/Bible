workflows:
  ios-release:
    name: Build iOS Release (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 22
      groups:
        - ios-secrets
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.agios.bible"
        TEAM_ID: "XMBVV283C4"
    cache:
      cache_paths:
        - node_modules
        - ~/.npm

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'

    scripts:
      - name: Install Dependencies
        script: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build Next.js Static Export
        script: npm run build:mobile

      - name: Capacitor Sync
        script: |
          npx cap sync ios

      - name: Patch Xcode Project
        script: |
          PROJECT_FILE="ios/App/App.xcodeproj/project.pbxproj"
          ENT_FILE="ios/App/App/App.entitlements"

          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' "$PROJECT_FILE"

          python3 -c "
          import re
          path = '$PROJECT_FILE'
          with open(path, 'r') as f: content = f.read()

          team_id = '$TEAM_ID'
          content = re.sub(r'DevelopmentTeam = [^;]*;', f'DevelopmentTeam = {team_id};', content)
          content = re.sub(r'DEVELOPMENT_TEAM = [^;]*;', f'DEVELOPMENT_TEAM = {team_id};', content)
          if 'DEVELOPMENT_TEAM' not in content:
              content = content.replace('buildSettings = {', f'buildSettings = {{\n\t\t\t\tDEVELOPMENT_TEAM = {team_id};')

          target_id = '504EC3031FED79650016851F'
          caps_str = '''SystemCapabilities = {
                          com.apple.AppleSignIn = {
                              enabled = 1;
                          };
                          com.apple.Push = {
                              enabled = 1;
                          };
                      };'''
          if 'SystemCapabilities' not in content:
              pattern = rf'({target_id}\s*=\s*\{{[^}}]*?ProvisioningStyle = Manual;)'
              content = re.sub(pattern, rf'\1\n\t\t\t\t\t\t{caps_str}', content, flags=re.DOTALL)

          content = re.sub(r'CODE_SIGN_ENTITLEMENTS = [^;]*;', 'CODE_SIGN_ENTITLEMENTS = App/App.entitlements;', content)

          # Strip conflicting manual signing settings — let xcodebuild flags take over
          content = re.sub(r'\s*CODE_SIGN_STYLE = [^;]*;', '', content)
          content = re.sub(r'\s*CODE_SIGN_IDENTITY[^;]*;', '', content)
          content = re.sub(r'\s*PROVISIONING_PROFILE[^;]*;', '', content)
          content = re.sub(r'\s*PROVISIONING_PROFILE_SPECIFIER[^;]*;', '', content)

          with open(path, 'w') as f: f.write(content)
          "

          if [ -f "$ENT_FILE" ]; then
            sed -i '' 's/development/production/g' "$ENT_FILE"
          fi

          echo "=== Verifying Xcode Patch ==="
          grep "DEVELOPMENT_TEAM" "$PROJECT_FILE" | head -3
          echo "=== Signing settings check (should all be empty) ==="
          grep -n "CODE_SIGN_STYLE" "$PROJECT_FILE" || echo "✅ Clean - no CODE_SIGN_STYLE found"
          grep -n "CODE_SIGN_IDENTITY" "$PROJECT_FILE" || echo "✅ Clean - no CODE_SIGN_IDENTITY found"
          grep -n "PROVISIONING_PROFILE" "$PROJECT_FILE" || echo "✅ Clean - no PROVISIONING_PROFILE found"
          grep "CODE_SIGN_ENTITLEMENTS" "$PROJECT_FILE" | head -3
          grep "SystemCapabilities" "$PROJECT_FILE" && echo "✅ Capabilities injected" || echo "⚠️ Capabilities NOT found"
          echo "=== Entitlements file ==="
          cat "$ENT_FILE" || echo "❌ Entitlements file not found"

      - name: Initialize Keychain
        script: keychain initialize

      - name: Setup ASC API Key
        script: |
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > /tmp/asc_key.p8

          echo "=== Enabling Push + Sign In with Apple on App ID ==="
          APP_STORE_CONNECT_PRIVATE_KEY="$(cat /tmp/asc_key.p8)" \
          app-store-connect bundles update \
            "$BUNDLE_ID" \
            --enable-sign-in-with-apple \
            --enable-push-notifications || echo "⚠️ Could not update capabilities (may already be enabled)"

          echo "✅ ASC API key ready"

      - name: Clear Xcode DerivedData
        script: |
          rm -rf ~/Library/Developer/Xcode/DerivedData
          echo "✅ DerivedData cleared"

      - name: Build IPA for TestFlight
        script: |
          echo "=== Build environment ==="
          echo "TEAM_ID: $TEAM_ID"

          ARCHIVE_PATH="$CM_BUILD_DIR/App.xcarchive"
          IPA_DIR="$CM_BUILD_DIR/ipa"
          mkdir -p "$IPA_DIR"

          echo "=== Archiving ==="
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination "generic/platform=iOS" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            -allowProvisioningUpdates \
            -skipPackagePluginValidation \
            -skipPackageSignatureValidation \
            ONLY_ACTIVE_ARCH=NO

          echo "=== Exporting IPA ==="
          cat > /tmp/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$IPA_DIR" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -allowProvisioningUpdates

          echo "=== IPA output ==="
          ls -la "$IPA_DIR"

    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true