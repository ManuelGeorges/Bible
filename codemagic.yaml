workflows:
  ios-testflight:
    name: iOS TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: "Agios App Store Key"
    environment:
      groups:
        - ios-secrets
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.agios.bible"
        TEAM_ID: "XMBVV283C4"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web project
        script: |
          npm run build:mobile
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Increment Build Number
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 100))
      - name: Build and Sign IPA
        script: |
          # 1. تهيئة الـ Keychain وتنظيف السيرفر
          keychain initialize
          find ~/Library -name "*.mobileprovision" -delete
          
          # 2. إنشاء الشهادة والبروفايل (الأوامر الجديدة)
          app-store-connect certificates create --type IOS_DISTRIBUTION --save
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          
          # 3. استخراج الـ UUID بطريقة احترافية (فك التشفير ثم القراءة)
          PROV_PROFILE=$(find ~/Library -name "*.mobileprovision" | head -n 1)
          if [ -z "$PROV_PROFILE" ]; then
            echo "خطأ: لم يتم العثور على بروفايل التوقيع!"
            exit 1
          fi
          
          # فك تشفير الملف وحفظه كـ XML لسهولة القراءة
          security cms -D -i "$PROV_PROFILE" > /tmp/profile.plist
          PROV_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist)
          
          echo "تم استخراج UUID بنجاح: $PROV_UUID"
          
          # 4. تحديث إعدادات المشروع برمجياً
          sed -i '' "s/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g" "$XCODE_PROJECT/project.pbxproj"
          sed -i '' "s/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = $TEAM_ID;/g" "$XCODE_PROJECT/project.pbxproj"
          
          xcode-project use-profiles --project "$XCODE_PROJECT"
          
          # 5. بناء الـ IPA مع تمرير كل شيء لـ Xcode بشكل صريح
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags "DEVELOPMENT_TEAM=$TEAM_ID PROVISIONING_PROFILE_SPECIFIER=$PROV_UUID CODE_SIGN_STYLE=Manual CODE_SIGN_ENTITLEMENTS=App/App.entitlements"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
