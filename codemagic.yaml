workflows:
  ios-testflight:
    name: iOS TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: "Agios App Store Key"
    environment:
      groups:
        - ios-secrets
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.agios.bible"
        TEAM_ID: "XMBVV283C4"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web project
        script: |
          npm run build:mobile
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Increment Build Number
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 100))
      - name: Build and Sign IPA
        script: |
          # 1. تهيئة الـ Keychain وتنظيف الملفات القديمة
          keychain initialize
          find ~/Library -name "*.mobileprovision" -delete
          
          # 2. جلب الشهادة والبروفايل (بدون باسوورد لتجنب أخطاء الأدوات)
          # هذا الأمر سيقوم بإنشاء الشهادة والبروفايل الصحيحين تلقائياً
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          
          # 3. استخراج الـ UUID للبروفايل الجديد
          PROV_PROFILE=$(find ~/Library -name "*.mobileprovision" | head -n 1)
          security cms -D -i "$PROV_PROFILE" > /tmp/profile.plist
          PROV_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist)
          echo "تم استخراج UUID: $PROV_UUID"
          
          # 4. تحديث المشروع برمجياً بشكل بسيط لضمان مطابقة الـ Team
          # نلغي التوقيع التلقائي ونحقن الـ Team ID
          sed -i '' "s/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g" "$XCODE_PROJECT/project.pbxproj"
          sed -i '' "s/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = $TEAM_ID;/g" "$XCODE_PROJECT/project.pbxproj"
          
          # نترك أداة Codemagic تقوم بربط البروفايلات بالمشروع
          xcode-project use-profiles --project "$XCODE_PROJECT"
          
          # 5. بناء الـ IPA
          # سنمرر الـ Team والـ UUID فقط، ونترك Xcode يختار هوية التوقيع المناسبة من الـ Keychain
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags "DEVELOPMENT_TEAM=$TEAM_ID PROVISIONING_PROFILE_SPECIFIER=$PROV_UUID CODE_SIGN_STYLE=Manual"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
