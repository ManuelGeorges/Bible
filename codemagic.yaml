workflows:
  ios-testflight:
    name: iOS TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: "Agios App Store Key"
    environment:
      groups:
        - ios-secrets
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.agios.bible"
        TEAM_ID: "XMBVV283C4"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web project
        script: |
          npm run build:mobile
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Increment Build Number
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 100))
      - name: Build and Sign IPA
        script: |
          # 1. تهيئة الـ Keychain وتنظيف الملفات القديمة
          keychain initialize
          find ~/Library -name "*.mobileprovision" -delete
          
          # 2. إنشاء الشهادة والبروفايل بكلمة سر لضمان فك التشفير
          export CERT_PASS="codemagic"
          app-store-connect certificates create --type IOS_DISTRIBUTION --save --password "$CERT_PASS"
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          
          # استيراد الشهادات يدوياً باستخدام كلمة السر
          find ~/Library -name "*.p12" -exec security import {} -k "$CM_KEYCHAIN_PATH" -P "$CERT_PASS" -A \;
          keychain add-certificates
          
          # 3. استخراج الـ UUID بعد فك التشفير
          PROV_PROFILE=$(find ~/Library -name "*.mobileprovision" | head -n 1)
          security cms -D -i "$PROV_PROFILE" > /tmp/profile.plist
          PROV_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist)
          echo "UUID المستخرج: $PROV_UUID"
          
          # 4. تحديث المشروع برمجياً بشكل "عدواني" لحل تعارض الأسماء
          # نحول كل شيء لـ Apple Distribution ونلغي التوقيع التلقائي
          sed -i '' "s/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g" "$XCODE_PROJECT/project.pbxproj"
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g" "$XCODE_PROJECT/project.pbxproj"
          sed -i '' "s/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = $TEAM_ID;/g" "$XCODE_PROJECT/project.pbxproj"
          sed -i '' "s/CODE_SIGN_IDENTITY = \"[^\"]*\";/CODE_SIGN_IDENTITY = \"Apple Distribution\";/g" "$XCODE_PROJECT/project.pbxproj"
          sed -i '' "s/\"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]\" = \"[^\"]*\";/\"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]\" = \"Apple Distribution\";/g" "$XCODE_PROJECT/project.pbxproj"
          
          xcode-project use-profiles --project "$XCODE_PROJECT"
          
          # 5. بناء الـ IPA
          # نمرر الهوية Apple Distribution والـ UUID بشكل صريح ونلغي أي تعارض
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags "DEVELOPMENT_TEAM=$TEAM_ID PROVISIONING_PROFILE_SPECIFIER=$PROV_UUID CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' CODE_SIGN_ENTITLEMENTS=App/App.entitlements"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
