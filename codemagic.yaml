workflows:
  ios-release:
    name: Build iOS Release (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 22
      groups:
        - ios-secrets
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.agios.bible"
        TEAM_ID: "XMBVV283C4"
    cache:
      cache_paths:
        - node_modules
        - ~/.npm

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'

    scripts:
      - name: Install Dependencies
        script: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build Next.js Static Export
        script: npm run build:mobile

      - name: Capacitor Sync
        script: |
          npx cap sync ios

      - name: Patch Xcode Project
        script: |
          PROJECT_FILE="ios/App/App.xcodeproj/project.pbxproj"
          ENT_FILE="ios/App/App/App.entitlements"

          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' "$PROJECT_FILE"

          python3 -c "
          import re
          path = '$PROJECT_FILE'
          with open(path, 'r') as f: content = f.read()

          content = re.sub(r'ProvisioningStyle = [^;]*;', 'ProvisioningStyle = Manual;', content)
          content = re.sub(r'CODE_SIGN_STYLE = [^;]*;', 'CODE_SIGN_STYLE = Manual;', content)

          team_id = '$TEAM_ID'
          content = re.sub(r'DevelopmentTeam = [^;]*;', f'DevelopmentTeam = {team_id};', content)
          content = re.sub(r'DEVELOPMENT_TEAM = [^;]*;', f'DEVELOPMENT_TEAM = {team_id};', content)
          if 'DEVELOPMENT_TEAM' not in content:
              content = content.replace('buildSettings = {', f'buildSettings = {{\n\t\t\t\tDEVELOPMENT_TEAM = {team_id};')

          content = content.replace('\"iPhone Developer\"', '\"Apple Distribution\"')
          content = content.replace('\"iPhone Distribution\"', '\"Apple Distribution\"')

          target_id = '504EC3031FED79650016851F'
          caps_str = '''SystemCapabilities = {
                          com.apple.AppleSignIn = {
                              enabled = 1;
                          };
                          com.apple.Push = {
                              enabled = 1;
                          };
                      };'''
          if 'SystemCapabilities' not in content:
              pattern = rf'({target_id}\s*=\s*\{{[^}}]*?ProvisioningStyle = Manual;)'
              content = re.sub(pattern, rf'\1\n\t\t\t\t\t\t{caps_str}', content, flags=re.DOTALL)

          content = re.sub(r'CODE_SIGN_ENTITLEMENTS = [^;]*;', 'CODE_SIGN_ENTITLEMENTS = App/App.entitlements;', content)

          with open(path, 'w') as f: f.write(content)
          "

          # Remove hardcoded provisioning profile specifiers so SPM packages don't inherit them
          sed -i '' '/PROVISIONING_PROFILE_SPECIFIER/d' "$PROJECT_FILE"

          if [ -f "$ENT_FILE" ]; then
            sed -i '' 's/development/production/g' "$ENT_FILE"
          fi

          echo "=== Verifying Xcode Patch ==="
          grep "DEVELOPMENT_TEAM" "$PROJECT_FILE" | head -3
          grep "CODE_SIGN_STYLE" "$PROJECT_FILE" | head -3
          grep "CODE_SIGN_ENTITLEMENTS" "$PROJECT_FILE" | head -3
          grep "SystemCapabilities" "$PROJECT_FILE" && echo "✅ Capabilities injected" || echo "⚠️ Capabilities NOT found"
          echo "=== Entitlements file ==="
          cat "$ENT_FILE" || echo "❌ Entitlements file not found"

      - name: Initialize Keychain
        script: keychain initialize

      - name: Setup Certificate and Provisioning Profile
        script: |
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "=== CERTIFICATE_PRIVATE_KEY not set — generating one time key ==="
            openssl genrsa -out /tmp/cert_key.pem 2048
            openssl pkcs8 -topk8 -inform PEM -outform PEM -nocrypt \
              -in /tmp/cert_key.pem -out /tmp/cert_key_pkcs8.pem
            echo "====== COPY THIS KEY INTO CODEMAGIC SECRETS AS CERTIFICATE_PRIVATE_KEY ======"
            cat /tmp/cert_key_pkcs8.pem
            echo "====== END OF KEY ======"
          else
            echo "✅ CERTIFICATE_PRIVATE_KEY found, using stored key"
            printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" > /tmp/cert_key_pkcs8.pem
          fi

          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > /tmp/asc_key.p8

          echo "=== Enabling Push + Sign In with Apple on App ID ==="
          APP_STORE_CONNECT_PRIVATE_KEY="$(cat /tmp/asc_key.p8)" \
          app-store-connect bundles update \
            "$BUNDLE_ID" \
            --enable-sign-in-with-apple \
            --enable-push-notifications || echo "⚠️ Could not update capabilities (may already be enabled)"

          echo "=== Fetching signing files ==="
          APP_STORE_CONNECT_PRIVATE_KEY="$(cat /tmp/asc_key.p8)" \
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key_pkcs8.pem \
            --create

          keychain add-certificates

          echo "=== Finding profile ==="
          PROFILE_PATH=$(find "$HOME/Library" -name "*.mobileprovision" 2>/dev/null | head -1)
          if [ -z "$PROFILE_PATH" ]; then
            echo "❌ No .mobileprovision file found!"
            exit 1
          fi

          echo "✅ Found profile: $PROFILE_PATH"

          echo "=== Profile capabilities ==="
          security cms -D -i "$PROFILE_PATH" | grep -E "aps-environment|com.apple.developer.applesignin" -A1 || echo "⚠️ No push/signin caps found in profile"

          PROFILE_UUID=$(python3 -c "
          import plistlib, subprocess
          out = subprocess.check_output(['security', 'cms', '-D', '-i', '$PROFILE_PATH'])
          p = plistlib.loads(out)
          print(p['UUID'])
          ")

          echo "✅ Profile UUID: $PROFILE_UUID"
          echo "PROFILE_UUID=$PROFILE_UUID" >> $CM_ENV

      - name: Build IPA for TestFlight
        script: |
          echo "=== Build environment ==="
          echo "PROFILE_UUID: $PROFILE_UUID"
          echo "TEAM_ID: $TEAM_ID"

          ARCHIVE_PATH="$CM_BUILD_DIR/App.xcarchive"
          IPA_DIR="$CM_BUILD_DIR/ipa"
          mkdir -p "$IPA_DIR"

          echo "=== Archiving ==="
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination "generic/platform=iOS" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -skipPackagePluginValidation \
            -skipPackageSignatureValidation

          echo "=== Exporting IPA ==="
          cat > /tmp/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$IPA_DIR" \
            -exportOptionsPlist /tmp/ExportOptions.plist

          echo "=== IPA output ==="
          ls -la "$IPA_DIR"

    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true