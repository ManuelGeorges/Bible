workflows:
  ios-release:
    name: Build iOS Release (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 22
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.agios.bible"
    cache:
      cache_paths:
        - node_modules
        - ~/.npm

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'

    scripts:
      - name: Install Dependencies
        script: | 
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build Next.js Static Export
        script: npm run build:mobile

      - name: Capacitor Sync
        script: |
          npx cap sync ios

      - name: Patch iOS Project for CI
        script: |
          # 1. فرض إصدار iOS 15.0 في كل مكان (المشروع و SPM)
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj
          if [ -f "ios/App/CapApp-SPM/Package.swift" ]; then
            sed -i '' 's/.iOS(.v[0-9]*)/.iOS(.v15)/g' ios/App/CapApp-SPM/Package.swift
          fi
          
          # 2. التأكد من أن Signing مضبوط على Manual ليقبله Codemagic
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/App/App.xcodeproj/project.pbxproj

      - name: Set up Keychain
        script: keychain initialize

      - name: Fetch Profiles and Code Sign
        script: |
          # إضافة فلاج --clean لإجبار الأداة على مسح الكاش القديم وتحميل البروفايل الجديد بالـ Capabilities الحالية
          xcode-project use-profiles --clean

      - name: Build IPA for TestFlight
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --configuration Release

    artifacts:
      - build/ios/ipa/*.ipa